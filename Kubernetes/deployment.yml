apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: flipkart-app-deployment
spec: # Defined the behaviour of the replicaset 
  replicas: 3
  selector: 
    matchLabels:
      web: flip
  template: # Pod Defination 
    metadata: 
      labels: 
        web: flip 
    spec: 
      containers:
        - name: flip-cont 
          image: muralisocial123/flipkart-clone-kuberox:v1.1.0
          ports: 
            - containerPort: 80
--- 
apiVersion: v1
kind: Service
metadata:
  name: flipkart-svc
spec:
  type: LoadBalancer
  externalIPs:
    - 190.170.20.238       # Your public Load Balancer IP
  selector:
    web: flip
  ports:
    - name: http
      port: 80            # Port exposed on Load Balancer
      targetPort: 80      # Container Port

